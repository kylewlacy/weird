[workspace]
resolver = "3"
default-members = ["crates/weird-server"]
members = [
    "apps/*",
    "crates/weird-client",
    "crates/weird-core",
    "crates/weird-server",
    "crates/weird-test-support",
]

[workspace.dependencies]
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
